[package]
name = "backend"
version = "0.2.1"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "derive",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }

tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
fsrs = "6.6.2"
