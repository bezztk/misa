[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "derive",
    "migrate",
    "chrono",
    "uuid",
    "json",
] }

tokio = { version = "1", features = ["full"] }
